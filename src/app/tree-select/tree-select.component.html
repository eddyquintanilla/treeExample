<mat-form-field>
  <mat-label>Selecciona un item</mat-label>
  <input
    matInput
    readonly
    [value]="selectedNode?.name || ''"
    (click)="toggleDropdown()"
  >
</mat-form-field>

@if (isDropdownOpen) {
  <div class="tree-dropdown show">
    <mat-tree
      [dataSource]="dataSource"
      [treeControl]="treeControl"
      class="example-tree"
    >
      <!-- Nodos sin hijos -->
      <mat-tree-node *matTreeNodeDef="let node">
  <button
    mat-button
    (click)="selectNode(node)"
    [class.selected]="node === selectedNode"
    class="leaf-node"
    [style.padding-left.px]="(node.level ?? 0) * 16 + 32"
  >
    {{ node.name }}
  </button>
</mat-tree-node>

      <!-- Nodos con hijos -->
      <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
        <div class="tree-node" [style.padding-left.px]="(node.level ?? 0) * 20">
          <button
            mat-icon-button
            (click)="treeControl.toggle(node)"
            [attr.aria-label]="'Toggle ' + node.name"
          >
            <mat-icon>
              {{ treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
            </mat-icon>
          </button>
          <button
            mat-button
            (click)="selectNode(node)"
            [class.selected]="node === selectedNode"
          >
            {{ node.name }}
          </button>
        </div>

        <div [class.hidden]="!treeControl.isExpanded(node)">
          <ng-container matTreeNodeOutlet></ng-container>
        </div>
      </mat-nested-tree-node>
    </mat-tree>
  </div>
}
